name: AsdaBarcodeGen
options:
  bundleIdPrefix: com.lkreku
targets:
  AsdaBarcodeGen:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: .
        excludes:
          - ".github/**"
          - "project.yml"
          - "README.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lkreku.asdabarcode
        SWIFT_OBJC_BRIDGING_HEADER: BridgingHeader.h
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "Camera access is required to scan product EAN-13 barcodes."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Photo library access is required to save generated barcodes to your Camera Roll."
        CODE_SIGNING_ALLOWED: NO
